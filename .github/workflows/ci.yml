name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency audit findings
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node -e 'const audit=require("./audit.json"); console.log("Audit summary:", audit.metadata?.vulnerabilities); for (const [name, item] of Object.entries(audit.vulnerabilities || {})) console.log(name, JSON.stringify({severity:item.severity,range:item.range,fixAvailable:item.fixAvailable}));'
      - name: Enforce dependency audit
        run: npm audit --audit-level=moderate
      - name: Run tests
        run: npm test
      - name: Run deterministic agent evaluation
        run: npm run evaluate
      - name: Build
        run: npm run build
